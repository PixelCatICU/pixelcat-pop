name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test and Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Package app bundle
        run: Scripts/package-app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PixelCatPop-app
          path: dist/PixelCatPop.app
